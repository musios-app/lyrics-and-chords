<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Lyrics & Chords icon in the marketplace's box-in-box: a white 80x80 tile (1px border, 24px corners)
     holding a 56x56 icon with 12px corners. Plain full-bleed square: icon-square.svg -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 80 80">
  <title>Lyrics &amp; Chords</title>
  <defs>
    <clipPath id="well">
      <rect x="12" y="12" width="56" height="56" rx="12" />
    </clipPath>
  </defs>
  <rect x="0.5" y="0.5" width="79" height="79" rx="23.5" fill="#ffffff" stroke="#e8e6dc" stroke-width="1" />
  <g clip-path="url(#well)">
    <svg x="12" y="12" width="56" height="56" viewBox="0 0 512 512">
      <rect width="512" height="512" fill="#b83eaa" />

      <g transform="translate(0 3.5)">

        <g transform="translate(10 0)">
          <!-- Page outline -->
          <rect x="72" y="80" width="348" height="345" rx="12" fill="none" stroke="#ffffff" stroke-width="20"
            stroke-linejoin="round" />

          <!-- Lyrics Text Lines (Left Side) -->
          <line x1="108" y1="140" x2="260" y2="140" stroke="#ffffff" stroke-width="18" stroke-linecap="round" />
          <line x1="108" y1="195" x2="260" y2="195" stroke="#ffffff" stroke-width="18" stroke-linecap="round" />
          <line x1="108" y1="250" x2="190" y2="250" stroke="#ffffff" stroke-width="18" stroke-linecap="round" />
          <line x1="108" y1="305" x2="150" y2="305" stroke="#ffffff" stroke-width="18" stroke-linecap="round" />
          <line x1="108" y1="365" x2="300" y2="365" stroke="#ffffff" stroke-width="18" stroke-linecap="round" />

          <!-- Music Note (Single note head with extended flag) -->
          <g transform="translate(100 0)">
            <!-- Note Head -->
            <ellipse cx="200" cy="285" rx="28" ry="22" fill="none" stroke="#ffffff" stroke-width="18" />
            <!-- Stem -->
            <line x1="228" y1="285" x2="228" y2="170" stroke="#ffffff" stroke-width="17" stroke-linecap="square" />
            <!-- Horizontal Flag / Half-Beam -->
            <polygon points="220,160 280,135 280,155 220,180" fill="#ffffff" stroke="#ffffff" stroke-width="1"
              stroke-linejoin="round" />
          </g>

        </g>

      </g>
    </svg>
  </g>
</svg>