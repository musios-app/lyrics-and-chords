<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  
  <g>
    <!-- Left Half (Lighter) -->
    <path d="M 72,40 L 256,40 L 256,472 L 72,472 Z" fill="#ebebe6"/>
    <!-- Right Half (Darker Shading) -->
    <path d="M 256,40 L 440,40 L 440,472 L 256,472 Z" fill="#ebebe6"/>
    <!-- Inner Border -->
    <rect x="72" y="40" width="368" height="432" rx="12" fill="none" stroke="#000000" stroke-width="20" stroke-linejoin="round"/>
  </g>

  <!-- Lyrics Text Lines (Left Side) -->
  <line x1="108" y1="140" x2="260" y2="140" stroke="#000000" stroke-width="18" stroke-linecap="round"/>
  <line x1="108" y1="195" x2="260" y2="195" stroke="#000000" stroke-width="18" stroke-linecap="round"/>
  <line x1="108" y1="250" x2="190" y2="250" stroke="#000000" stroke-width="18" stroke-linecap="round"/>
  <line x1="108" y1="305" x2="150" y2="305" stroke="#000000" stroke-width="18" stroke-linecap="round"/>
  <line x1="108" y1="365" x2="300" y2="365" stroke="#000000" stroke-width="18" stroke-linecap="round"/>

  <!-- Music Note (Single note head with extended flag) -->
  <g transform="translate(100 0)">
    <!-- Note Head -->
    <circle cx="200" cy="285" r="28" fill="none" stroke="#000000" stroke-width="18"/>
    <!-- Stem -->
    <line x1="228" y1="285" x2="228" y2="170" stroke="#000000" stroke-width="17" stroke-linecap="square"/>
    <!-- Horizontal Flag / Half-Beam -->
    <polygon points="220,160 300,135 300,155 220,180" fill="#000000" stroke="#000000" stroke-width="1" stroke-linejoin="round"/>
  </g>

</svg>